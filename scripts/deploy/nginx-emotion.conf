# /etc/nginx/sites-available/emotion
# 前端 dist 静态托管 + /api 反代到本机 8080。8080 不对公网开放，只经这里进。
server {
    listen 80;
    server_name _;

    root /opt/emotion/current/web;
    index index.html;

    # 单页应用：非静态资源一律回 index.html，交给 vue-router
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 行情刷新一次最多 15s（market.budget-ms），这里留足余量，别让 nginx 先超时
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 带 hash 的构建产物可以长缓存，index.html 必须不缓存否则发版后用户拿到旧入口
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

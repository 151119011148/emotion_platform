# ============================================================================
# emotion-web.conf —— Nginx 站点配置（Alibaba Cloud Linux 版本）
#
# 由 deploy.sh 安装到 /etc/nginx/conf.d/emotion-web.conf，
# 然后 nginx -t && nginx -s reload 生效。
#
# 目录约定：前端 dist 静态托管在 /var/www/emotion-web，
#           /api 反向代理到本机 8080（emotion-server），8080 不对公网开放。
#
# 与 scripts/deploy/（Ubuntu / Debian 用 sites-available）的差异：
#   · RHEL 系（Alibaba Cloud Linux）用 conf.d/ 目录
#   · web root 固定在 /var/www/emotion-web，而不是 current 软链下的 web/
# ============================================================================
server {
    listen       80;
    server_name  _;                    # 任意域名/直接 IP 访问

    root         /var/www/emotion-web; # 前端构建产物（emotion-web/dist）
    index        index.html;

    # 单页应用：所有路径都先找真实文件，找不到就回 index.html 交给 vue-router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存；index.html 必须不缓存，否则发版后用户拿到旧入口
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API 反向代理到后端 8080。保留 /api 前缀（后端 controller 就是 /api/...）。
    location /api/ {
        proxy_pass          http://127.0.0.1:8080;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        # 行情刷新一次最长 15s（market.budget-ms），这里留足余量别让 nginx 先超时
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 隐藏文件一律拒绝
    location ~ /\. {
        deny all;
    }

    # 上传体积限制（按需调整）
    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
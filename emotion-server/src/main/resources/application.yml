server:
  port: 8080

spring:
  # 真实口令在同模块根的 application-local.yml（未入库，见 application-local.yml）。
  # 走 profile 文档而不是 spring.config.import：导入的那份优先级低于本文件，占位会反过来盖掉真值。
  # additional-location: 覆盖多种工作目录场景（IDE 启动在项目根 / 命令行 cd emotion-server / java -jar 所在目录）
  config:
    additional-location: "file:./,file:./emotion-server/"
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${MYSQL_IP:localhost}:3306/emotion_dashboard?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- Flyway：数据库变更的版本管理 ----
  # 迁移脚本在 src/main/resources/db/migration：V1__xxx.sql 起，每次变更递增一个版本号。
  # 已经应用过的版本严禁修改（校验会红），要改就写下个版本。
  # baseline-version=24：存量库（已经手工跑过 schema.sql 的库）首次接入时直接打基线到第 24 版，
  #   V1..V24 一条都不重放——那段历史里有 DELETE+INSERT 的种子收敛，重放会把手工改过的权重洗掉。
  #   空库则跳过基线，从 V1 顺序建起。
  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration
    table: t_flyway_history
    baseline-on-migrate: true
    baseline-version: 24
    baseline-description: '存量库基线：已手工执行过 schema.sql'
    out-of-order: false
    validate-on-migrate: true
    # 清库是删库级别的动作，本地调试也不该顺手可用
    clean-disabled: true

  # ---- Quartz：单机定时任务 ----
  # 任务定义(delay/cron/是否启用)在 t_scheduler_job 表里维护，启动时同步进 QRTZ_*。
  # 不设 startup-delay：要让 Quartz 在 ApplicationRunner 之前起来，
  # 否则平台那次装载会撞上「调度器还没启动」——装载失败的任务当天就不会跑了。
  quartz:
    job-store-type: jdbc
    scheduler-name: emotion-scheduler
    auto-startup: true
    overwrite-existing-jobs: true
    jdbc:
      # QRTZ_* 的建表由 Flyway V25 负责。这里必须 never：两条路径同时建表会互相踩。
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceId: AUTO
      # 不设 org.quartz.jobStore.class：job-store-type=jdbc 时 Boot 会自动用 LocalDataSourceJobStore
      # 把 Spring 托管的 DataSource 接进来。显式配成 JobStoreTX 会盖掉它，
      # 原生实现找不到数据源，启动直接报「DataSource name not set」。
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.threadPool.threadCount: 3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  # 签名密钥一旦公开等于任何人都能伪造合法 token，所以真值只在未入库的 application-local.yml 里
  secret: ${JWT_SECRET:}
  expiration: 86400000

# 行情源。全部走 http 明文：本机 JDK 8u201 的 cacerts 早于 Let's Encrypt 根证书普及，
# https 会在信任链上随机翻车，而这些接口 http/https 返回的字节完全一致。
market:
  # 一次拉取的总预算，超时就把手上的部分结果返回，不再等
  budget-ms: 12000
  connect-timeout-ms: 1500
  read-timeout-ms: 3500
  retries: 1
  pool-size: 5
  intraday-ttl-ms: 60000
  cache-max-entries: 256
  tencent:
    base: http://qt.gtimg.cn
    chunk-size: 50
    sh-index: sh000001
    sz-index: sz399001
    # 实时快照只给最新一天，历史交易日的成交额靠这根日 K 回溯。
    # http 版只会 302 到 https，所以直接配 https（本机 JDK 8 信任其证书，已实测 200）
    kline-url: https://proxy.finance.qq.com/ifzqgtimg/appstock/app/newfqkline/get
    # 回看根数：只要覆盖到请求日即可，2026-09-04 往前 12 根能到 08-21
    day-amount-bars: 12
    # 五大指数收盘的取数清单：gtimg 码 → t_index_close.index_code。
    # 右边那五个必须和 ReviewImportParser.KNOWN_INDEXES 一致，否则导入器认得的名字和这里存的对不上。
    # 北证50 只能 bj 前缀：实测 sh899050 回空数组，bj899050 才有 9/4 的收盘。
    index-close-codes: sh000001:000001,sz399001:399001,sz399006:399006,sh000688:000688,bj899050:899050
  eastmoney:
    # 只有三个池子接口可用；日K主机（push2his/push2/92.push2his）本机实测全部空响应
    pool-base: http://push2ex.eastmoney.com
    # 上游 tc 是真实家数，rows 会被这个值截断；截断时会给出警告而不是静默少算
    pool-size: 200
    # A股代码总表：只有 delay 子域在本机通（push2 / 1.push2 / 80.push2 全是空响应）
    list-base: http://push2delay.eastmoney.com
    # 异动监管公告：必须带 ann_type=A，且服务端过滤参数一律被静默忽略，判类别只能在客户端按类目码
    ann-base: https://np-anotice-stock.eastmoney.com
